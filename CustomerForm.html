<!doctype html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <link rel="stylesheet" href="style.css" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Customer Appointment Form</title>
  </head>
  <body>
    <a href="Home.html" class="back-home">← Back to Home</a>
    <form id="bookingForm">
      <h2>Book your Appointment 🌸</h2>

      <label> Full Name</label>
      <input type="text" id="name" placeholder="Enter your name" required />

      <label>Phone No.</label>
      <input
        type="tel"
        id="phone"
        placeholder="Enter 10 digits"
        pattern="[0-9]{10}"
        required
      />

      <label>Mail</label>
      <input type="email" id="email" placeholder="Enter your mail" required />

      <label for="services"> Choose Service </label>
      <select id="services" required>
        <option value="">Select a service</option>
        <option value="Hair Care">Hair Care</option>
        <option value="Skin Care">Skin Care</option>
        <option value="Manicure">Manicure</option>
        <option value="Pedicure">Pedicure</option>
      </select>

      <label> Appointment Date </label>
      <input type="date" id="date" required />

      <label> Preferred Time </label>
      <input type="time" id="time" required />

      <button type="submit">Book Appointment</button>
      <p id="message"></p>
    </form>

    <script type="module" src="firebase.js"></script>
    <script type="module" src="script.js"></script>
  </body>
</html>
